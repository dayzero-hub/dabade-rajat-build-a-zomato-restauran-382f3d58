<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Briyani House – Zomato</title>
	</head>
	<body>
		<header>
			<h1>Briyani house</h1>
			<p>Biryani · Koramangala · ★ 4.3</p>
		</header>
		<main>
			<img src="images/biryani-house.svg" alt="A steaming handi of chicken biryani garnished with fried onions and coriander, served at a table at Biryani House">
			<section>
				<h2>Menu</h2>
				<h3>Starters</h3>
				<ul>
					<li>Chicken 65 – ₹220</li>
					<li>Seekh Kebab – ₹260</li>
					<li>Paneer Tikka – ₹200</li>
				</ul>
				<h3>Main Course</h3>
				<ul>
					<li>Chicken Biryani – ₹280</li>
					<li>Mutton Biryani – ₹340</li>
					<li>Veg Biryani – ₹220</li>
				</ul>
			</section>
			<section>
				<h2>Address &amp; Hours</h2>
			</section>
			<section>
				<h2>Book a Table</h2>
				<form>
					<div>
						<label for="booking-name">Name</label>
						<input type="text" id="booking-name" name="name" required>
					</div>
					<div>
						<label for="booking-phone">Phone number</label>
						<input type="tel" id="booking-phone" name="phone" required>
					</div>
					<div>
						<label for="booking-date">Date</label>
						<input type="date" id="booking-date" name="date" required>
					</div>
					<div>
						<label for="booking-people">Number of people</label>
						<input type="number" id="booking-people" name="people" min="1" max="20" required>
					</div>
					<div>
						<label for="booking-notes">Notes</label>
						<textarea id="booking-notes" name="notes"></textarea>
					</div>
					<button type="submit">Book table</button>
				</form>
			</section>
		</main>
	</body>
</html>
